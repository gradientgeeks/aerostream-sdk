name: Publish — NuGet (GradientGeeks.AeroStream.Client)

on:
  push:
    tags:
      - 'dotnet/v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.0-preview)'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # Required for NuGet Trusted Publishers (OIDC) — no NUGET_API_KEY needed
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: dotnet

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/dotnet/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore /p:Version=${{ steps.ver.outputs.version }}

      - name: Test
        run: dotnet test -c Release --no-build --verbosity minimal

      - name: Pack (with symbols .snupkg)
        run: |
          dotnet pack src/GradientGeeks.AeroStream.Client/GradientGeeks.AeroStream.Client.csproj \
            -c Release --no-build \
            /p:Version=${{ steps.ver.outputs.version }} \
            -o ./nupkg

      # NuGet Trusted Publisher: exchanges OIDC token for short-lived API key.
      # Configure on nuget.org: Account → Trusted publishing → Create
      #   Repository owner: gradientgeeks
      #   Repository:       aerostream-sdk
      #   Workflow file:    publish-nuget.yml
      - name: NuGet login (OIDC Trusted Publisher)
        uses: NuGet/login@v1
        id: nugetlogin
        with:
          user: uttammahata  # policy creator username (not org owner)

      - name: Push to NuGet.org
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key "${{ steps.nugetlogin.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          dotnet nuget push ./nupkg/*.snupkg \
            --api-key "${{ steps.nugetlogin.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
