name: Publish — Java (GitHub Packages & Maven Central)

on:
  push:
    tags:
      - 'java/v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Java package version'
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    defaults:
      run:
        working-directory: java

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: 'github'

      - name: Build & Package (JAR + Sources + Javadoc)
        run: |
          mvn clean package source:jar javadoc:jar -DskipTests

      - name: Deploy to GitHub Packages Maven Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn deploy:deploy-file \
            -Dfile=target/aerostream-client-0.1.0-preview.jar \
            -DrepositoryId=github \
            -Durl=https://maven.pkg.github.com/gradientgeeks/aerostream-sdk \
            -DpomFile=pom.xml \
            -Dsources=target/aerostream-client-0.1.0-preview-sources.jar \
            -Djavadoc=target/aerostream-client-0.1.0-preview-javadoc.jar \
            --settings /home/runner/.m2/settings.xml || true
