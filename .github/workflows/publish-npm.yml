name: Publish — npm (@gradientgeeks/aerostream-client)

on:
  push:
    tags:
      - 'nodejs/v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.0-preview)'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # Required for npm Trusted Publishers (OIDC) — no NPM_TOKEN needed
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: nodejs

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          scope: '@gradientgeeks'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/nodejs/v}"
          npm version "$TAG" --no-git-tag-version

      - name: Set version from input
        if: github.event_name == 'workflow_dispatch'
        run: npm version "${{ github.event.inputs.version }}" --no-git-tag-version

      # Trusted Publisher: uses OIDC — no NPM_TOKEN required.
      # Configure on npmjs.com: package settings → Publishing → Trusted Publisher
      #   Repository owner: gradientgeeks
      #   Repository name:  aerostream-sdk
      #   Workflow file:    publish-npm.yml
      #   Environment:      (leave blank or set to 'npm-publish')
      - name: Publish to npm (Trusted Publisher / OIDC)
        run: npm publish --provenance --access public
