name: Publish — npm (@gradientgeeks/aerostream-client)

on:
  push:
    tags:
      - 'nodejs/v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for OIDC Trusted Publisher

    defaults:
      run:
        working-directory: nodejs

    steps:
      - uses: actions/checkout@v4

      # Do NOT set NODE_AUTH_TOKEN here — let OIDC handle auth
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          scope: '@gradientgeeks'

      - run: npm ci
      - run: npm run build

      - name: Publish to npm (OIDC Trusted Publisher)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *"-"* ]]; then
            TAG="next"
          else
            TAG="latest"
          fi
          echo "Publishing $VERSION with tag=$TAG"
          npm publish --provenance --access public --tag "$TAG"
        env:
          NODE_AUTH_TOKEN: ''   # clear token set by setup-node so OIDC is used
