name: Publish — npm (@gradientgeeks/aerostream-client)

on:
  push:
    tags:
      - 'nodejs/v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version already in package.json to publish'
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for OIDC Trusted Publisher

    defaults:
      run:
        working-directory: nodejs

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          scope: '@gradientgeeks'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Trusted Publisher OIDC — no NPM_TOKEN needed.
      # Prerelease versions must use --tag to avoid defaulting to latest.
      - name: Publish to npm (Trusted Publisher / OIDC)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Publishing version: $VERSION"
          if [[ "$VERSION" == *"-"* ]]; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public --tag latest
          fi
