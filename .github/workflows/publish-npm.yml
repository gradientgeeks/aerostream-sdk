name: Publish — npm (@gradientgeeks/aerostream-client)

on:
  push:
    tags:
      - 'nodejs/v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.1-preview) — must already be in package.json'
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Required for npm Trusted Publishers (OIDC) — no NPM_TOKEN needed
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: nodejs

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          scope: '@gradientgeeks'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Version in package.json is the source of truth — no override needed.
      # Use version-bump.yml to bump + tag, which commits package.json first.
      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/nodejs/v}"
          PKG=$(node -p "require('./package.json').version")
          echo "Tag version: $TAG  |  package.json: $PKG"
          if [[ "$TAG" != "$PKG" ]]; then
            echo "::warning::Tag $TAG != package.json $PKG — publishing package.json version $PKG"
          fi

      # Trusted Publisher: OIDC — no NPM_TOKEN required.
      # Configured at npmjs.com → @gradientgeeks/aerostream-client → Publishing
      - name: Publish to npm (Trusted Publisher / OIDC)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *"-"* ]]; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi
